name: Research incubator reference checks
on:
  push:
    paths:
      - 'research-incubator/**'
      - '.github/workflows/research-incubator-tests.yml'
  pull_request:
    paths:
      - 'research-incubator/**'
      - '.github/workflows/research-incubator-tests.yml'
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test and RTL simulation dependencies
        run: |
          python -m pip install 'numpy>=1.24' 'pytest>=8'
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
      - name: Validate new portable C matrix-multiplication reference
        working-directory: research-incubator/chipyard-gemmini
        run: make test
      - name: Validate new 32-bit ALU Verilog reference
        working-directory: research-incubator/cpu32-modified-alu
        run: make test
      - name: Validate new NumPy CNN inference references
        working-directory: research-incubator/neocpu-cnn-inference
        run: |
          python -m pytest -q tests/
          python benchmark.py --batch 1 --height 8 --width 8 --channels 2 --filters 3 --repeats 2
